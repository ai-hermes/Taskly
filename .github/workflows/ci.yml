name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs for the same ref (latest push wins).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      rust: ${{ steps.filter.outputs.rust }}
      go: ${{ steps.filter.outputs.go }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'apps/desktop/**'
              - '!apps/desktop/src-tauri/**'
              - 'packages/core/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/ci.yml'
            rust:
              - 'apps/desktop/src-tauri/**'
              - 'apps/desktop/scripts/build-pi-sidecar.mjs'
              - '.github/workflows/ci.yml'
            go:
              - 'apps/server/**'
              - '.github/workflows/ci.yml'

  frontend:
    name: Frontend (typecheck + test + build)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build core package
        run: pnpm --filter @taskly/core build

      - name: Type-check & build frontend
        run: pnpm --filter @taskly/desktop build

      - name: Unit tests
        run: pnpm --filter @taskly/desktop test

  rust:
    name: Rust (fmt + clippy + check)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      # tauri-build validates that the `externalBin` sidecar exists for the host
      # triple before any cargo command runs. Building the real pi sidecar is
      # slow and network-heavy, and lint/check only need our own crate to
      # compile, so we drop a lightweight placeholder for the host triple (the
      # real binary is produced in release.yml).
      - name: Stub sidecar for build validation
        shell: bash
        run: |
          TRIPLE=$(rustc -vV | sed -n 's/host: //p')
          EXT=""
          [ "$RUNNER_OS" = "Windows" ] && EXT=".exe"
          mkdir -p binaries/pi-package
          touch "binaries/pi-coding-agent-${TRIPLE}${EXT}"
          echo "stubbed binaries/pi-coding-agent-${TRIPLE}${EXT}"

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo check
        run: cargo check

  go:
    name: Go server (vet + build + test)
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test ./...
