[package]
name = "taskly-ocr"
version = "0.1.0"
edition = "2021"
description = "Standalone local OCR sidecar for the Taskly CLI (image -> JSON via ocr-rs)."

[[bin]]
name = "taskly-ocr"
path = "src/main.rs"

[dependencies]
ocr-rs = "2.3.2"
image = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
strip = true
